[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "https://scrobbler-dashboard.netlify.app/*"
  to   = "https://app.scrobbler.is-a.bot/:splat"
  status = 301